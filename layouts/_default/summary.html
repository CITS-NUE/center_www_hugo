{{/* 一覧ページのカード．トップページの各種サービスと同じ見た目にそろえる．
     カード全体がリンクなので，以前の「詳しくはこちら」ボタンは題名の矢印に代えた． */}}
<a class="card-tile" href="{{ .RelPermalink }}">
  <span class="card-tile__title">{{ .Title }}</span>
  {{ with .Summary | plainify | strings.TrimSpace }}
    <span class="card-tile__text">{{ . | truncate 110 }}</span>
  {{ end }}
</a>
